[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "samery-audio"
dynamic = ["version"]
description = "Inspect lossless audio and compare decoded PCM using FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["audio", "lossless", "flac", "alac", "pcm", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/omidalighadr/samery-audio"
Documentation = "https://github.com/omidalighadr/samery-audio#readme"
Issues = "https://github.com/omidalighadr/samery-audio/issues"
Changelog = "https://github.com/omidalighadr/samery-audio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.9", "mypy>=1.15"]

[project.scripts]
samery-audio = "samery_audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "samery_audio._version.__version__"}

[tool.setuptools.package-data]
samery_audio = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
